workflows:

  android-workflow:
    name: Ges Boutique RN - Android APK Release
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      node: 22.16.0
      java: 17
      groups:
        - android-signing

    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm install --legacy-peer-deps
          echo "=== Installing react-native-worklets for reanimated 4.x ==="
          npm install react-native-worklets --legacy-peer-deps --no-save 2>&1 || echo "WARN: react-native-worklets install failed (non-fatal)"
          echo "=== Expo version installed ==="
          node -e "console.log('expo:', require('./node_modules/expo/package.json').version)"
          echo "=== Reanimated version installed ==="
          node -e "console.log('reanimated:', require('./node_modules/react-native-reanimated/package.json').version)"
          echo "=== Worklets version installed ==="
          node -e "try{console.log('worklets:', require('./node_modules/react-native-worklets/package.json').version)}catch(e){console.log('worklets NOT FOUND: '+e.message)}"

      - name: Accept Android licenses + install NDK
        script: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" || true

      - name: Expo prebuild Android
        script: |
          set -e
          echo "=== expo binary check ==="
          ls -la ./node_modules/.bin/expo || echo "ERROR: expo binary not found in node_modules"
          echo "=== expo version ==="
          ./node_modules/.bin/expo --version
          ./node_modules/.bin/expo prebuild --platform android --clean
          echo "=== newArchEnabled in gradle.properties ==="
          grep -i "newArchEnabled" android/gradle.properties || echo "NOT FOUND"

      - name: Configure Android SDK path
        script: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK debug
        script: |
          cd android
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -60
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== Exit code Gradle: $EXIT_CODE ==="
          echo "=== Recherche APK ==="
          find . -name "*.apk" -type f | sort
          exit $EXIT_CODE

      - name: Copier APK a la racine
        script: |
          APK=$(find android -name "*debug*.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find android -name "*.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERREUR: Aucun APK trouve"
            find android -type f -name "*.apk" || true
            exit 1
          fi
          echo "APK trouve: $APK"
          cp "$APK" ges-boutique-debug.apk
          ls -lh ges-boutique-debug.apk

    artifacts:
      - ges-boutique-debug.apk
      - android/app/build/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - doumaiga3@gmail.com
        notify:
          success: true
          failure: true
