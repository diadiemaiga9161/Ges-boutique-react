workflows:

  android-workflow:
    name: Ges Boutique RN - Android APK Debug
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      node: 22.16.0
      java: 17

    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm install --legacy-peer-deps
          echo "=== Expo version installed ==="
          node -e "console.log('expo:', require('./node_modules/expo/package.json').version)"
          echo "=== Reanimated version installed ==="
          node -e "console.log('reanimated:', require('./node_modules/react-native-reanimated/package.json').version)"
          echo "=== Worklets version installed ==="
          node -e "try{console.log('worklets:', require('./node_modules/react-native-worklets/package.json').version)}catch(e){console.log('worklets NOT FOUND: '+e.message)}"

      - name: Accept Android licenses + install NDK
        script: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" || true

      - name: Expo prebuild Android
        script: |
          set -e
          ./node_modules/.bin/expo prebuild --platform android --clean
          echo "=== gradle.properties ==="
          grep -E "newArchEnabled|hermesEnabled" android/gradle.properties || true

      - name: Bundle JavaScript (diagnostic complet)
        script: |
          set -e
          mkdir -p android/app/src/main/assets
          echo "=== Bundling JS pour Android ==="
          node ./node_modules/.bin/react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          echo "=== Bundle créé OK ==="
          ls -lh android/app/src/main/assets/index.android.bundle

      - name: Configure Android SDK path
        script: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK release (keystore de test auto)
        script: |
          cd android
          echo "=== Génération keystore de test ==="
          keytool -genkey -v \
            -keystore test-release.jks \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 365 \
            -noprompt \
            -dname "CN=GesBoutique, O=Test, C=ML" \
            -storepass testpass \
            -keypass testpass
          echo "=== Build release ==="
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/test-release.jks \
            -Pandroid.injected.signing.store.password=testpass \
            -Pandroid.injected.signing.key.alias=release \
            -Pandroid.injected.signing.key.password=testpass \
            --no-daemon 2>&1 | tail -150
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== Exit code Gradle: $EXIT_CODE ==="
          find . -name "*.apk" -type f | sort
          exit $EXIT_CODE

      - name: Copier APK a la racine
        script: |
          APK=$(find android -name "*release*.apk" | grep -v "unsigned" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find android -name "*.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERREUR: Aucun APK trouve"
            find android -type f -name "*.apk" || true
            exit 1
          fi
          echo "APK trouve: $APK"
          cp "$APK" ges-boutique-release.apk
          ls -lh ges-boutique-release.apk

    artifacts:
      - ges-boutique-release.apk
      - android/app/build/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - doumaiga3@gmail.com
        notify:
          success: true
          failure: true
