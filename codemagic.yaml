workflows:

  android-workflow:
    name: Ges Boutique RN - APK Release (installable)
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      node: 22.16.0
      java: 17

    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm install --legacy-peer-deps

      - name: Accept Android licenses + install NDK
        script: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" || true

      - name: Expo prebuild Android
        script: |
          set -e
          export NODE_ENV=production
          ./node_modules/.bin/expo prebuild --platform android --clean
          # assembleRelease bundle toujours le JS — pas besoin de bundleInDebug
          # Signer avec la clé debug pour pouvoir installer sans Play Store
          printf '\n// Patch: debug signing for release APK (testable)\nandroid.buildTypes.release.signingConfig = android.signingConfigs.debug\n' >> android/app/build.gradle
          echo "=== Patch signing ==="
          tail -5 android/app/build.gradle

      - name: Configure Android SDK path
        script: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK Release (JS bundlé automatiquement par Gradle)
        script: |
          cd android
          export NODE_ENV=production
          ./gradlew assembleRelease \
            -x lintVitalRelease \
            -x lintVitalReleaseExecute \
            --no-daemon > /tmp/gradle.log 2>&1; EXIT_CODE=$?
          echo "=== ERREURS BUNDLE JS (si présentes) ==="
          grep -E "FAILED|error:|Error:|Cannot resolve|Execution failed|Process.*node" /tmp/gradle.log | head -30 || true
          echo "=== FIN LOG ==="
          tail -25 /tmp/gradle.log
          echo "=== Exit: $EXIT_CODE ==="
          find . -name "*.apk" -type f | sort
          exit $EXIT_CODE

      - name: Copier APK a la racine
        script: |
          APK=$(find android -name "*release*.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find android -name "*.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERREUR: Aucun APK trouve"
            exit 1
          fi
          echo "APK: $APK"
          cp "$APK" ges-boutique-release.apk
          ls -lh ges-boutique-release.apk

    artifacts:
      - ges-boutique-release.apk
      - android/app/build/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - doumaiga3@gmail.com
        notify:
          success: true
          failure: true
