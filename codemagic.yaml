workflows:

  android-workflow:
    name: Ges Boutique RN - Android APK Debug
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      node: 22.16.0
      java: 17

    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm install --legacy-peer-deps
          echo "=== Expo version ==="
          node -e "console.log('expo:', require('./node_modules/expo/package.json').version)"
          echo "=== @react-native-community/cli version ==="
          node -e "console.log('cli:', require('./node_modules/@react-native-community/cli/package.json').version)"

      - name: Accept Android licenses + install NDK
        script: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" || true

      - name: Expo prebuild Android
        script: |
          set -e
          ./node_modules/.bin/expo prebuild --platform android --clean
          # Forcer le bundle JS dans l'APK debug (sinon l'app cherche Metro)
          echo "bundleInDebug=true" >> android/gradle.properties
          echo "=== gradle.properties ==="
          grep -E "newArchEnabled|bundleInDebug" android/gradle.properties

      - name: Configure Android SDK path
        script: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK debug
        script: |
          cd android
          # NODE_ENV requis par les tâches Expo pour le bundling
          export NODE_ENV=production
          ./gradlew assembleDebug --no-daemon > /tmp/gradle.log 2>&1; EXIT_CODE=$?
          # Afficher l'erreur node en premier (visible dans les 50 dernières lignes)
          echo "=== ERREUR NODE (si présente) ==="
          grep -A8 "Process.*command.*node\|error:\|Error:" /tmp/gradle.log | head -40 || echo "Aucune erreur node trouvée"
          echo "=== FIN DU LOG GRADLE ==="
          tail -20 /tmp/gradle.log
          echo "=== Exit: $EXIT_CODE ==="
          find . -name "*.apk" -type f | sort
          exit $EXIT_CODE

      - name: Copier APK a la racine
        script: |
          APK=$(find android -name "*debug*.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find android -name "*.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERREUR: Aucun APK trouve"
            exit 1
          fi
          cp "$APK" ges-boutique-debug.apk
          ls -lh ges-boutique-debug.apk

    artifacts:
      - ges-boutique-debug.apk
      - android/app/build/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - doumaiga3@gmail.com
        notify:
          success: true
          failure: true
