workflows:

  android-workflow:
    name: Ges Boutique RN - Android APK Release
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      node: 22.16.0
      java: 17
      groups:
        - android-signing

    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm install --legacy-peer-deps
          echo "=== Expo version installed ==="
          node -e "console.log('expo:', require('./node_modules/expo/package.json').version)"
          echo "=== Reanimated version installed ==="
          node -e "console.log('reanimated:', require('./node_modules/react-native-reanimated/package.json').version)"
          echo "=== Worklets version installed ==="
          node -e "try{console.log('worklets:', require('./node_modules/react-native-worklets/package.json').version)}catch(e){console.log('worklets NOT FOUND: '+e.message)}"
          echo "=== react-native-screens version installed ==="
          node -e "console.log('rn-screens:', require('./node_modules/react-native-screens/package.json').version)"

      - name: Accept Android licenses + install NDK
        script: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" || true

      - name: Expo prebuild Android
        script: |
          set -e
          echo "=== expo version ==="
          ./node_modules/.bin/expo --version
          ./node_modules/.bin/expo prebuild --platform android --clean
          echo "=== newArchEnabled in gradle.properties ==="
          grep -i "newArchEnabled" android/gradle.properties || echo "NOT FOUND (Old Architecture)"

      - name: Configure Android SDK path
        script: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK release
        script: |
          set -e
          cd android
          # Décodage du keystore depuis la variable Codemagic
          echo "$CM_KEYSTORE" | base64 --decode > keystore.jks
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD" \
            --no-daemon 2>&1 | tail -80
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== Exit code Gradle: $EXIT_CODE ==="
          echo "=== Recherche APK ==="
          find . -name "*.apk" -type f | sort
          exit $EXIT_CODE

      - name: Copier APK a la racine
        script: |
          APK=$(find android -name "*release*.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find android -name "*.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERREUR: Aucun APK trouve"
            find android -type f -name "*.apk" || true
            exit 1
          fi
          echo "APK trouve: $APK"
          cp "$APK" ges-boutique-release.apk
          ls -lh ges-boutique-release.apk

    artifacts:
      - ges-boutique-release.apk
      - android/app/build/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - doumaiga3@gmail.com
        notify:
          success: true
          failure: true
