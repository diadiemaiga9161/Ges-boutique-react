workflows:

  android-workflow:
    name: Ges Boutique RN - Android APK Debug
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      node: 22.16.0
      java: 17

    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm install --legacy-peer-deps
          echo "=== @react-native-community/cli version ==="
          node -e "console.log('cli:', require('./node_modules/@react-native-community/cli/package.json').version)"

      - name: Accept Android licenses + install NDK
        script: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" || true

      - name: Expo prebuild Android
        script: |
          set -e
          export NODE_ENV=production
          ./node_modules/.bin/expo prebuild --platform android --clean
          echo "=== gradle.properties ==="
          grep -E "newArchEnabled|bundleInDebug|hermes" android/gradle.properties || true

      - name: Test bundle JS (expo export:embed)
        script: |
          export NODE_ENV=production
          mkdir -p android/app/src/main/assets
          echo "=== Test expo export:embed ==="
          ./node_modules/.bin/expo export:embed \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res 2>&1
          EXPO_EXIT=$?
          echo "=== expo export:embed exit: $EXPO_EXIT ==="
          ls -lh android/app/src/main/assets/index.android.bundle 2>/dev/null || echo "Bundle NON créé"

      - name: Configure Android SDK path
        script: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK debug (bundle pre-genere, skip bundle task)
        script: |
          cd android
          export NODE_ENV=production
          # Bundle JS déjà généré par expo export:embed - sauter la tâche bundle Gradle
          ./gradlew assembleDebug \
            -x bundleDebugJsAndAssets \
            --no-daemon > /tmp/gradle.log 2>&1; EXIT_CODE=$?
          echo "=== ERREUR NODE (si présente) ==="
          grep -A5 "Process.*node\|error:\|Error:" /tmp/gradle.log | head -30 || true
          tail -20 /tmp/gradle.log
          echo "=== Exit: $EXIT_CODE ==="
          find . -name "*.apk" -type f | sort
          exit $EXIT_CODE

      - name: Copier APK a la racine
        script: |
          APK=$(find android -name "*debug*.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find android -name "*.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERREUR: Aucun APK trouve"
            exit 1
          fi
          cp "$APK" ges-boutique-debug.apk
          ls -lh ges-boutique-debug.apk

    artifacts:
      - ges-boutique-debug.apk
      - android/app/build/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - doumaiga3@gmail.com
        notify:
          success: true
          failure: true
